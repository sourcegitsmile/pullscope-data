# Nightly data buffer for Pullscope (dec_0017).
# Pages serves branch main, folder / (https://sourcegitsmile.github.io/pullscope-data/).
# The job rebuilds cards + prices, mirrors new Yu-Gi-Oh! images, then commits v1/ and img/ to main.
# No secrets: pushes with GITHUB_TOKEN (contents: write).
name: data-buffer
on:
  schedule:
    - cron: "40 21 * * *"   # tcgcsv refreshes ~20:00 UTC; run after it
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-buffer, cancel-in-progress: false }
env:
  DATA_BASE_URL: ${{ vars.DATA_BASE_URL || 'https://sourcegitsmile.github.io/pullscope-data' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180     # first run mirrors ~14.8k Yu-Gi-Oh! images; nightly runs take minutes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow==11.0.0
      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: http-${{ github.run_id }}
          restore-keys: http-
      - name: Seed mirrored images from the published site (file name = hash of source URL)
        run: |
          mkdir -p pipeline/out/img/ygo
          if [ -d img/yugioh ]; then cp img/yugioh/* pipeline/out/img/ygo/ 2>/dev/null || true; fi
      - name: Build card data + prices
        working-directory: pipeline
        run: python3 build.py --all-sets
      - name: Mirror Yu-Gi-Oh! images (YGOPRODeck forbids hotlinking), WebP 420 px
        working-directory: pipeline
        run: python3 mirror_images.py --game ygo
      - name: Package the CDN contract the app reads (PRD file 4 §2)
        working-directory: pipeline
        run: python3 package.py --image-base "$DATA_BASE_URL"
      - name: Pages size guard (published site limit 1 GB)
        run: python3 check_size.py pipeline/dist --limit-mb 900
      - name: Publish to main
        run: |
          rsync -a --delete pipeline/dist/v1/ v1/
          mkdir -p img && rsync -a --delete pipeline/dist/img/ img/
          touch .nojekyll
          git config user.name "data-buffer bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1 img .nojekyll   # path-limited add also stages deletions
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "data: $(date -u +%F)"
          git push
