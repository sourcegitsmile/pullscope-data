# Nightly data buffer for Pullscope (dec_0017).
# main     = the pipeline (this file, pipeline/*.py) — normal history.
# gh-pages = the published site, recreated as ONE orphan commit each run, so daily price files and
#            ~550 MB of images never pile up in git history. Pages serves gh-pages, folder /.
# Each run starts from the previous site: mirrored images are reused, price history is extended.
# No secrets: pushes with GITHUB_TOKEN (contents: write).
name: data-buffer
on:
  schedule:
    - cron: "40 21 * * *"   # tcgcsv refreshes ~20:00 UTC; run after it
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-buffer, cancel-in-progress: false }
env:
  DATA_BASE_URL: ${{ vars.DATA_BASE_URL || 'https://sourcegitsmile.github.io/pullscope-data' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330     # first run: --all-sets fetch + 75 min of image mirroring; nightly runs take minutes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow==11.0.0
      - name: Restore HTTP cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/.cache
          key: http-${{ github.run_id }}
          restore-keys: http-
      - name: Fetch the previous site (images + price history)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prev-site
          else
            mkdir -p prev-site
          fi
          mkdir -p pipeline/out/img/ygo
          if [ -d prev-site/img/yugioh ]; then cp prev-site/img/yugioh/* pipeline/out/img/ygo/ 2>/dev/null || true; fi
      - name: Build card data + prices + FX
        working-directory: pipeline
        run: python3 build.py --all-sets
      - name: Mirror Yu-Gi-Oh! images (YGOPRODeck forbids hotlinking), WebP 420 px
        working-directory: pipeline
        run: python3 mirror_images.py --game ygo --max-minutes 75
      - name: Package the CDN contract the app reads (PRD file 4 §2) + history + trending
        working-directory: pipeline
        run: python3 package.py --image-base "$DATA_BASE_URL" --history-in ../prev-site/v1/history
      - name: Save HTTP cache (also when a later step fails, so the next run starts warm)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/.cache
          key: http-${{ github.run_id }}
      - name: Pages size guard (published site limit 1 GB)
        run: python3 check_size.py pipeline/dist --limit-mb 900
      - name: Publish to gh-pages (single orphan commit)
        # Built inside the clone of the previous site: git then knows which blobs (images) the remote
        # already has and uploads only the new ones.
        run: |
          cd prev-site
          [ -d .git ] || git init -q -b gh-pages
          git config user.name "data-buffer bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan publish
          git rm -rq --cached -- v1 img .nojekyll 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../pipeline/dist/. .
          touch .nojekyll
          git add -- v1 .nojekyll
          if [ -d img ]; then git add -- img; fi
          git commit -q -m "data: $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" publish:gh-pages
